# Praktikan: presensi dengan kode manual 123456 di sesi "Pemrograman Mobile" (Dekanat FSM).
# Syarat: seeder baru dijalankan.
# Lokasi: di development build, flow menekan tombol "Simulasi Lokasi di Lab (Testing)" bila
# posisi HP di luar radius. Di APK preview tombol itu tidak ada, jadi HP harus berada di lab.
appId: com.oasxyz.HadirKu
---
- runFlow:
    file: subflows/masuk.yaml
    env:
      EMAIL: ${PRAKTIKAN_EMAIL}
      SANDI: ${PRAKTIKAN_SANDI}
- tapOn: "Buka detail sesi"
- extendedWaitUntil:
    visible: "Presensi"
    timeout: 15000
- scrollUntilVisible:
    element: "Perbarui Lokasi"
- tapOn: "Perbarui Lokasi"
- tapOn:
    text: 'Simulasi Lokasi di Lab \(Testing\)'
    optional: true
- extendedWaitUntil:
    visible: "Di dalam radius"
    timeout: 20000
- scrollUntilVisible:
    element: 'Kamera bermasalah\? Ketik kode 6 digit'
- tapOn: 'Kamera bermasalah\? Ketik kode 6 digit'
- inputText: "123456"
- hideKeyboard
- tapOn: "Kirim Presensi"
- extendedWaitUntil:
    visible: "Sudah Hadir"
    timeout: 20000
